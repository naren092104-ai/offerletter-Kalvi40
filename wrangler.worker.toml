name = "kalvi40-offer-worker"
main = "worker/index.ts"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_STORAGE_BUCKET = "offer-letters"
ALLOWED_ORIGIN = "https://offerletter-kalvi40.pages.dev"
APP_URL = "https://offerletter-kalvi40.pages.dev"

# Create this queue in the Cloudflare account before deploying:
# `npx wrangler queues create kalvi40-email-queue`
[[queues.producers]]
queue = "kalvi40-email-queue"
binding = "EMAIL_QUEUE"

[[queues.consumers]]
queue = "kalvi40-email-queue"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3

# Required Wrangler secrets/environment:
# - JWT_SECRET (Worker-generated HS256 token signing key; keep consistent across deployments)
# - SUPABASE_URL
# - SUPABASE_SECRET_KEY (or legacy SUPABASE_SERVICE_ROLE_KEY) for admin lookup/update and audit logging
# - SUPABASE_PUBLISHABLE_KEY is retained for the existing Worker stub routes only
# SUPABASE_SERVICE_ROLE_KEY is retained only for legacy integrations.
